    <link rel="apple-touch-icon" href="/logo-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#E8F5E9">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-green: #16a34a;
        --brand-pink: #db2777;
        --soft-bg: #F9FBFA;
        --pastel-pink: #FCE4EC;
      }
      body {
        font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
        background-color: var(--soft-bg);
        color: #1f2937;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        /* Support for notch/safe areas */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .sinhala {
        font-family: 'Noto Sans Sinhala', sans-serif;
      }
      .zen-shadow { 
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 12px -2px rgba(0, 0, 0, 0.02); 
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      
      @keyframes pulse-soft {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      .animate-pulse-soft {
        animation: pulse-soft 3s infinite ease-in-out;
      }

      @keyframes phrase-flow {
        0% { opacity: 0; transform: translateX(40px); }
        15% { opacity: 1; transform: translateX(0); }
        85% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(-40px); }
      }
      .animate-phrase-flow {
        animation: phrase-flow 7s ease-in-out infinite;
      }

      @keyframes progress-bar {
        0% { transform: scaleX(0); }
        50% { transform: scaleX(0.5); }
        100% { transform: scaleX(1); }
      }
      .animate-progress {
        animation: progress-bar 45s ease-out forwards;
      }

      @keyframes float-dream {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.05); }
      }
      .animate-float-dream {
        animation: float-dream 4s infinite ease-in-out;
      }

      @keyframes orbit-slow {
        from { transform: rotate(0deg) translateX(20px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(20px) rotate(-360deg); }
      }
      .animate-orbit {
        animation: orbit-slow 6s linear infinite;
      }

      @keyframes shimmer-fast {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .shimmer-text {
        background: linear-gradient(90deg, #9333ea, #db2777, #9333ea);
        background-size: 200% auto;
        -webkit-backdrop-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer-fast 3s linear infinite;
      }

      /* Custom scrollbar for clean mobile look */
      ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
    <script>
      window.global = window;
      window.process = window.process || { env: {} };
    </script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
